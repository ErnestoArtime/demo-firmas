services:
  backend:
    image: demo-firmas:main
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_STORAGE_TEMPLATES_DIR: /app/storage/templates
      APP_STORAGE_OUTPUT_DIR: /app/storage/output
      APP_SAMPLES_DIR: /app/storage/samples
      APP_CONVERT_SOFFICE_COMMAND: soffice
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: https://demo-firmas.eav-labs.com
    volumes:
      - ./storage:/app/storage
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8108:80"
