spring.application.name=demo
app.storage.templates-dir=${APP_STORAGE_TEMPLATES_DIR:storage/templates}
app.storage.output-dir=${APP_STORAGE_OUTPUT_DIR:storage/output}
app.storage.max-template-bytes=${APP_STORAGE_MAX_TEMPLATE_BYTES:10485760}
app.storage.max-generated-bytes=${APP_STORAGE_MAX_GENERATED_BYTES:20971520}
app.samples.dir=${APP_SAMPLES_DIR:storage/samples}
app.convert.soffice-command=${APP_CONVERT_SOFFICE_COMMAND:soffice}
app.convert.timeout-seconds=${APP_CONVERT_TIMEOUT_SECONDS:90}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,https://*.vercel.app,https://*.onrender.com}
app.security.api-key.enabled=${APP_SECURITY_API_KEY_ENABLED:false}
app.security.api-key.mode=${APP_SECURITY_API_KEY_MODE:plain}
app.security.api-key.header-name=${APP_SECURITY_API_KEY_HEADER_NAME:X-API-Key}
app.security.api-key.keys=${APP_SECURITY_API_KEY_KEYS:}
app.security.api-key.key-id-header-name=${APP_SECURITY_API_KEY_ID_HEADER_NAME:X-API-Key-Id}
app.security.api-key.signature-header-name=${APP_SECURITY_API_KEY_SIGNATURE_HEADER_NAME:X-API-Signature}
app.security.api-key.timestamp-header-name=${APP_SECURITY_API_KEY_TIMESTAMP_HEADER_NAME:X-API-Timestamp}
app.security.api-key.nonce-header-name=${APP_SECURITY_API_KEY_NONCE_HEADER_NAME:X-API-Nonce}
app.security.api-key.hmac-clients=${APP_SECURITY_API_KEY_HMAC_CLIENTS:}
app.security.api-key.max-skew-seconds=${APP_SECURITY_API_KEY_MAX_SKEW_SECONDS:300}
app.security.api-key.require-nonce=${APP_SECURITY_API_KEY_REQUIRE_NONCE:true}
app.security.api-key.require-https=${APP_SECURITY_API_KEY_REQUIRE_HTTPS:false}
app.security.api-key.public-paths=${APP_SECURITY_API_KEY_PUBLIC_PATHS:/,/hola,/health,/swagger-ui/**,/v3/api-docs/**,/api/drafts/sign/**}
app.security.api-key.nonce-cleanup-interval-ms=${APP_SECURITY_API_KEY_NONCE_CLEANUP_INTERVAL_MS:60000}

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Persistencia H2 (modo fichero, sobrevive reinicios)
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./storage/db/demo;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${APP_DB_USER:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${APP_H2_CONSOLE_ENABLED:false}

# Borradores de firma
app.drafts.token-ttl-days=${APP_DRAFTS_TOKEN_TTL_DAYS:7}
app.drafts.public-base-url=${APP_DRAFTS_PUBLIC_BASE_URL:http://localhost:4200}
