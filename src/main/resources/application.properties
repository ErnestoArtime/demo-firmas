spring.application.name=demo
app.storage.templates-dir=${APP_STORAGE_TEMPLATES_DIR:storage/templates}
app.storage.output-dir=${APP_STORAGE_OUTPUT_DIR:storage/output}
app.samples.dir=${APP_SAMPLES_DIR:storage/samples}
app.convert.soffice-command=${APP_CONVERT_SOFFICE_COMMAND:soffice}
app.convert.timeout-seconds=${APP_CONVERT_TIMEOUT_SECONDS:90}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,https://*.vercel.app,https://*.onrender.com}

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
